$kind: http-request
url: https://perfanalytics-api.onrender.com/api/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "admin@example.com",
        "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if(jsonData.token){
          pm.environment.set("jwt_token", jsonData.token);
      }
    language: text/javascript
order: 2000

services:
  # Backend Service
  - type: web
    name: perfanalytics-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Frontend Service
  - type: web
    name: perfanalytics-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://perfanalytics-api.onrender.com
    # Redirect all requests to index.html for React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
